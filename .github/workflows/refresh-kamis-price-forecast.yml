name: Refresh KAMIS price forecasts

on:
  schedule:
    # 매일 오전 11:17 KST. 정각 집중 실행을 피한다.
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: refresh-kamis-price-forecast
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ml/requirements.txt
      - run: python -m pip install -r ml/requirements.txt
      - name: Collect KAMIS prices and retrain
        run: python ml/train_price_forecast.py --refresh
        env:
          KAMIS_CERT_KEY: ${{ secrets.KAMIS_CERT_KEY }}
          KAMIS_CERT_ID: seedjong-navi
      - name: Publish the latest forecasts
        run: python ml/publish_price_forecast.py
        env:
          SUPABASE_URL: https://gigetevcjsyfrsacpvnd.supabase.co
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
